</style></head><body><main><header><a href="/index.html">星星作业社<span>✦</span></a><a id="identity" href="/family.html">加入 / 恢复身份</a></header><div id="page" aria-live="polite"><p class="empty">正在读取云端进度…</p></div></main><nav aria-label="主导航"><div><a href="/index.html"><span>✦</span>攒星规则</a><a href="/homework.html"><span>▦</span>作业打卡</a><a href="/leaderboard.html"><span>♧</span>同学周榜</a><a href="/rewards.html"><span>☆</span>星星奖励</a><a href="/family.html"><span>⚙</span>家庭管理</a></div></nav><div id="notice" role="status"></div><dialog id="modal"><h2 id="heading"></h2><div id="content"></div><p id="err"></p><footer><button id="closeModal">关闭</button></footer></dialog><script>
const subjects=['数学','语文','英语','科学'];const page=document.getElementById('page'),modal=document.getElementById('modal'),heading=document.getElementById('heading'),content=document.getElementById('content'),err=document.getElementById('err'),notice=document.getElementById('notice');let token=localStorage.familyKey||'',me=null,boardData=null,busy=false,ready=false,identityUnavailable=false,pendingSubject=null,timer;try{boardData=JSON.parse(sessionStorage.boardCache||'null')}catch{}const routeOf=path=>path.replace(/\/$/,'').replace(/\.html$/,'')||'/index';const route=routeOf(location.pathname);document.querySelectorAll('nav a').forEach(a=>{if(routeOf(new URL(a.href).pathname)===route){a.classList.add('active');a.setAttribute('aria-current','page')}});
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};function btn(text,fn,cls){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b}function toast(message){notice.textContent=message;clearTimeout(timer);timer=setTimeout(()=>notice.textContent='',6500)}function fail(e){err.textContent=e.message;toast(e.message)}function dialog(title){heading.textContent=title;content.replaceChildren();err.textContent='';if(!modal.open)modal.showModal();return content}document.getElementById('closeModal').onclick=()=>modal.close();
function cleanKey(value){const match=String(value||'').match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);if(!match)throw Error('身份已失效，请重新选择已有孩子。');return match[0].toLowerCase()}
async function api(path,form,key=token){if(key)key=cleanKey(key);const r=await fetch('/api/'+path,{cache:'no-store',method:form?'POST':'GET',headers:key?{Authorization:'Bearer '+key}:{},body:form});const j=await r.json();if(!r.ok){const e=Error(j.error||'请求失败');e.status=r.status;throw e}return j}
function savedChildren(){try{return JSON.parse(localStorage.myChildren||'[]')}catch{return []}}function remember(child,key=token){if(!child||!key)return;const children=savedChildren(),record={id:child.id,name:child.name,key:cleanKey(key),deleted:!!child.deleted,canManage:child.canManage!==false},i=children.findIndex(x=>x.id===child.id);if(i<0)children.push(record);else children[i]={...record,managementKey:children[i].managementKey||(children[i].canManage!==false?children[i].key:undefined)};localStorage.myChildren=JSON.stringify(children)}
async function load(){
 identityUnavailable=false;
 const needBoard=route==='/leaderboard'||route==='/homework'||route==='/family'||!token;
 const boardPromise=needBoard?api('board',null,'').then(data=>{boardData=data;try{sessionStorage.boardCache=JSON.stringify(data)}catch{}}).catch(()=>{if(!boardData)toast('周榜暂时无法更新，请稍后刷新。')}):Promise.resolve();
 let currentInvalid=false;
 const mePromise=token?api('me',null,token).then(child=>{me=child;remember(child,token)}).catch(e=>{currentInvalid=[401,404].includes(e?.status);identityUnavailable=!currentInvalid;if(!currentInvalid)toast('身份加载失败，请刷新重试。')}):Promise.resolve();
 await Promise.all([boardPromise,mePromise]);
 if(token&&(currentInvalid||me?.deleted)){
   const fallbacks=[...new Set(savedChildren().filter(c=>!c.deleted&&c.key&&c.key!==token).map(c=>c.key))];
   for(const key of fallbacks){
     try{const child=await api('me',null,key);remember(child,key);if(!child.deleted){me=child;token=localStorage.familyKey=key;toast('已切换到 '+me.name);currentInvalid=false;break}}catch{}
   }
   if(currentInvalid)me=null;
 }
 ready=true;draw()
}
async function act(action,fields={},key=token){if(busy)return false;busy=true;document.querySelectorAll('#content button').forEach(b=>b.disabled=true);try{const f=new FormData();f.set('action',action);for(const [k,v] of Object.entries(fields))f.set(k,v);const child=await api('me',f,key);remember(child,key);if(key===token||action==='join'){me=child;token=localStorage.familyKey=key}modal.close();ready=true;draw();toast(action==='submit'?'✓ 打卡成功，已保存到云端':'已保存到云端');api('board',null,'').then(data=>{boardData=data;if(route==='/leaderboard'&&!modal.open)draw()}).catch(()=>{});return true}catch(e){fail(e);return false}finally{busy=false;document.querySelectorAll('#content button').forEach(b=>b.disabled=false)}}
function title(kicker,text,sub){const d=el('div',undefined,'sectionHead');d.append(el('div',kicker,'eyebrow'),el('h1',text));if(sub)d.append(el('p',sub,'muted'));page.append(d)}function card(titleText){const c=el('section',undefined,'card');if(titleText)c.append(el('h2',titleText));page.append(c);return c}function link(text,href,cls){const a=el('a',text,cls);a.href=href;return a}function row(parent,name,action,sub){const r=el('div',undefined,'listRow'),s=el('span',name);if(sub)s.append(el('small',sub));r.append(s);if(action)r.append(action);parent.append(r)}function requireMe(){if(me&&!me.deleted)return true;if(token&&!me&&identityUnavailable){const c=card('暂时无法读取孩子身份');c.append(el('p','这是加载失败，不代表孩子或奖励记录丢失。','muted'),btn('重新加载',()=>load().catch(fail),'primary'));return false}const c=card('选择已有孩子');c.append(el('p','选择已有孩子，打卡和奖励会自动读取同一份云端记录。','muted'));drawGate(c);return false}
function dateTime(t){return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(t))}
function draw(){document.getElementById('identity').textContent=me&&!me.deleted?me.name+' · '+me.balance+' 星':'选择孩子';page.replaceChildren();if(!ready&&route!=='/index'&&(route!=='/homework'||token)){page.append(el('p','正在读取孩子身份和最新进度…','empty'));return}switch(route){case '/homework':drawHomework();break;case '/leaderboard':drawBoard();break;case '/rewards':drawRewards();break;case '/family':drawFamily();break;default:drawRules()}}
function drawRules(){title('HOW TO EARN STARS','先把规则讲清楚','全部时间均为北京时间');const c=card();c.classList.add('rules');const rules=[['周一至周四','晚上 9:00 前全部完成','每晚一轮，数学、语文、英语、科学四科全部完成',2],['周末 · 提前','周六晚上 10:00 前全部完成','周末作业全部完成，获得提前奖励',5],['周末 · 按时','周日中午 12:00 前全部完成','周六22:00后、周日12:00前完成',2]];for(const [when,what,sub,points]of rules){const r=el('div',undefined,'ruleRow'),d=el('div');d.append(el('p',what),el('small',sub));const p=el('div',String(points),'points');p.append(el('small','颗星'));r.append(el('strong',when),d,p);c.append(r)}const bonus=el('div',undefined,'bonus');bonus.append(el('strong','首位全部完成，再多 2 颗星'),el('p','周一至周四每天评选一次；周末这一轮也评选一位。以全部作业确认完成的云端时间为准。'));page.append(bonus);page.append(el('p','数学、语文、英语、科学四科全部完成后，按完成时间计星。','reminder'));const note=card('还有这几条');note.append(el('p','• 周末5星和2星为两个档位，不叠加。','muted'),el('p','• 周五至周日算同一轮周末作业。','muted'),el('p','• 每一轮基础星星只领取一次，首名另加2星。','muted'),el('p','• 兑换奖励扣除可用星星，保留周榜积分。','muted'));page.append(link('去完成今天的作业 →','/homework.html','wide primary'));const links=el('div',undefined,'linkRow');links.append(link('看看同学进度','/leaderboard.html'),link('我的星星奖励','/rewards.html'));page.append(links)}
function drawHomework(){title('TODAY’S HOMEWORK',me?.now.weekend?'周末作业打卡':'今天的作业打卡','数学 · 语文 · 英语 · 科学，四科独立打卡');if(!me||me.deleted){drawGuestTasks();return}const n=me.now,r=me.rounds[n.key],count=Object.keys(r?.work||{}).length;const c=card();const top=el('div',undefined,'cardTitle');top.append(el('h2',me.name),el('span',count+' / 4 科已完成','muted'));c.append(top);const stats=el('div',undefined,'stats');for(const [v,k]of [[me.balance,'可用星星'],[me.currentPoints,'本轮已得'],[me.weekStars,'本周积分']]){const d=el('div');d.append(el('b',String(v)),el('small',k));stats.append(d)}c.append(stats);c.append(btn('切换孩子',switchChild));page.append(el('p',n.closed?'本轮已截止。下轮开始后可继续打卡。':n.weekend?'周六22:00前全部完成5星；周日12:00前全部完成2星。':'今晚21:00前全部完成，获得2星。','reminder'));const grid=el('div',undefined,'taskGrid');subjects.forEach((s,j)=>{const work=r?.work[j],t=el('article',undefined,'task'+(work?' done':''));t.append(el('h3',s),el('p',work?'本项已完成':'完成本科全部作业'));const b=btn(work?'✓ 已打卡':n.closed?'已截止':'完成',async()=>{b.disabled=true;b.textContent='保存中…';const ok=await act('submit',{round:n.key,subject:j,text:'已完成',completionConfirmed:'true'});if(!ok){b.disabled=false;b.textContent='完成'}},'primary');b.disabled=!!work||n.closed;t.append(b);grid.append(t)});page.append(grid);if(count===4&&!r.completedAt&&!n.closed){const box=el('div',undefined,'completion');box.append(el('p','四科已打卡，请确认全部完成后按新规则结算。'),btn('确认全部作业完成',()=>act('confirmRound',{completionConfirmed:'true'}),'primary'));page.append(box)}else if(r?.completedAt){page.append(el('div','全部完成于 '+dateTime(r.completedAt)+' · 本轮获得 '+me.currentPoints+' 星'+(me.first?'（含首名额外2星）':''),'completion'))}page.append(link('查看完整计星规则','/index.html','wide'));const past=card('往期记录');const rounds=Object.entries(me.rounds).filter(([k])=>k!==n.key).reverse();if(!rounds.length)past.append(el('p','还没有往期记录。','empty'));for(const [k,v]of rounds)row(past,k,el('span',Object.keys(v.work).length+'/4 科','muted'),v.completedAt?'全部完成于 '+dateTime(v.completedAt):'未全部完成')}
function drawGuestTasks(){
 page.append(el('p','点击科目的“完成”，选中已有孩子，即可保存打卡。','reminder'));
 const grid=el('div',undefined,'taskGrid');subjects.forEach((subject,j)=>{const t=el('article',undefined,'task');t.append(el('h3',subject),el('p','完成本科全部作业'),btn('完成',()=>{pendingSubject=j;const c=dialog(subject+'打卡 · 选择孩子');drawGate(c)},'primary'));grid.append(t)});page.append(grid);
 const c=card('选择已有孩子');drawGate(c)
}
async function finishPending(){if(pendingSubject!==null&&me&&!me.deleted){const j=pendingSubject;pendingSubject=null;await act('submit',{round:me.now.key,subject:j,text:'已完成',completionConfirmed:'true'})}}
function confirmationCheck(container,text,submitText,fn){const f=el('form'),label=el('label',undefined,'checkLabel'),check=el('input');check.type='checkbox';check.required=true;label.append(check,el('span',text));const submit=el('button',submitText,'wide primary');submit.type='submit';f.append(label,submit);f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;await fn();submit.disabled=false};container.append(f)}
function confirmSubject(j){const c=dialog(subjects[j]+'完成确认');c.append(el('p','请先完成老师布置的所有内容。','muted'));confirmationCheck(c,'本项作业已全部完成（老师未布置本项任务时，可确认无需完成）。','确认打卡',()=>act('submit',{round:me.now.key,subject:j,text:'已完成',completionConfirmed:'true'}))}
function confirmRound(){const c=dialog('确认四科全部完成');confirmationCheck(c,'数学、语文、英语、科学四科均已完成。','确认完成并结算星星',()=>act('confirmRound',{completionConfirmed:'true'}))}
function drawBoard(){title('WEEKLY LEADERBOARD','同学进度与周榜','本轮作业进度 · 本周累计星星');const c=card();if(!boardData?.rows.length)c.append(el('p','还没有同学加入。','empty'));for(const [i,r]of (boardData?.rows||[]).entries()){const d=el('article',undefined,'boardRow'+(me?.id===r.id?' mine':'')),top=el('div',undefined,'boardTop'),name=el('span');name.append(el('span',String(i+1).padStart(2,'0'),'rank'),document.createTextNode(r.name));if(me?.id===r.id)name.append(el('span','我','tag'));top.append(name,el('b','☆ '+r.week));const chips=el('div',undefined,'chips');subjects.forEach((s,j)=>chips.append(el('span',s+(r.done.includes(j)?' ✓':' ·'),'chip'+(r.done.includes(j)?' done':''))));d.append(top,chips);if(r.first)d.append(el('small','本轮首位全部完成 · 已加2星','muted'));c.append(d)}page.append(el('p','每60秒自动更新，也会在重新打开页面时立即同步。完成全部作业才计星，规则以首页为准。','pageFoot'))}
function drawRewards(){title('STAR REWARDS','星星奖励',me&&!me.deleted?'当前孩子：'+me.name:'先选择孩子，再查看对应奖励');if(!requireMe())return;const c=card('可用星星');const stats=el('div',undefined,'stats'),d=el('div');d.append(el('b',me.balance+' ☆'),el('small','兑换不影响周榜积分'));stats.append(d);c.append(stats);const shelf=card(me.name+' 的奖励');if(!me.rewards.length)shelf.append(el('p','家长设置奖励后会显示在这里。','empty'));for(const r of me.rewards){const enough=me.balance>=r.cost,b=btn(me.canManage===false?'请家长兑换':enough?'兑换':'还差 '+(r.cost-me.balance)+' 星',()=>{const c=dialog('兑换奖励');c.append(el('p','用 '+r.cost+' 颗星兑换「'+r.name+'」？'),btn('确认兑换',()=>act('redeem',{reward:r.id}),'wide primary'))});b.disabled=!enough||me.canManage===false;row(shelf,r.name,b,'所需 '+r.cost+' 星')}page.append(link('家长设置 / 修改奖励','/family.html#rewards','wide'));if(me.claims.length){const c=card('已兑换');for(const name of me.claims)c.append(el('p','✓ '+name,'muted'))}}
function drawFamily(){title('FAMILY SETTINGS','家庭管理','孩子身份与家长设置放在这里');if(!me){drawGate();return}if(me.deleted){const c=card('请选择正在使用的孩子');c.append(el('p','之前的孩子已移出榜单，请切换到 Nicole 或其他已有身份。','muted'),btn('切换孩子',switchChild,'primary'));return}const c=card('当前孩子 · '+me.name);const actions=el('div',undefined,'actionGrid');if(me.canManage!==false)actions.append(btn('修改昵称',renameChild),btn('切换 / 创建孩子',switchChild),btn('管理自己创建的孩子',manageChildren),btn('查看家庭恢复码',()=>{const c=dialog('家庭恢复码');c.append(el('p','仅供自己保存。持有码的人可管理此身份，请勿公开。','muted'),el('code',token))}),btn('清空打卡与星星',()=>confirmDelete('reset',token,me.name),'danger'),btn('删除当前孩子',()=>confirmDelete('deletePlayer',token,me.name),'danger'));c.append(btn('切换孩子',switchChild,'primary'));c.append(actions);if(me.canManage!==false&&me.canUndoReset)c.append(btn('恢复上次清空的记录',()=>act('undoReset')));const settings=card(me.name+' · 奖励设置');settings.id='rewardSettings';const f=el('form');f.className='rewardForm';const name=el('input'),cost=el('input'),submit=el('button','添加奖励');name.placeholder='奖励名称';name.required=true;name.maxLength=50;cost.placeholder='所需星星';cost.type='number';cost.min=1;cost.step=1;cost.required=true;submit.type='submit';f.append(name,cost,submit);f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;submit.textContent='保存中…';const ok=await act('reward',{name:name.value,cost:cost.value});if(!ok){submit.disabled=false;submit.textContent='添加奖励'}};settings.append(f);for(const r of me.rewards){const buttons=el('div');buttons.append(btn('编辑',()=>editReward(r)),btn('下架',()=>{const c=dialog('下架奖励');c.append(el('p','下架「'+r.name+'」？'),btn('确认下架',()=>act('remove',{reward:r.id}),'wide'))}));row(settings,r.name,buttons,r.cost+' 星')}if(location.hash==='#rewards')settings.scrollIntoView({block:'start'})}
function drawGate(container=page){
 const c=el('section',undefined,'card');c.append(el('h2','选择已有孩子'));
 const choices=boardData?.rows||[];
 if(!choices.length)c.append(el('p',boardData?'还没有孩子，可在下方创建。':'正在读取孩子列表…','muted'));
 for(const child of choices)row(c,child.name,btn('选择并进入',()=>chooseExisting(child.id),'primary'),child.count+'/4 科已完成');
 const f=el('form'),name=el('input'),submit=el('button','创建孩子','primary');name.placeholder='新孩子昵称';name.required=true;name.maxLength=16;submit.type='submit';f.append(name,submit);f.onsubmit=async e=>{e.preventDefault();const ok=await act('join',{name:name.value},crypto.randomUUID());if(ok)await finishPending()};const detail=el('details'),summary=el('summary','没有这个孩子？创建新孩子');detail.append(summary,f);c.append(detail);container.append(c)
}
async function chooseExisting(id){if(busy)return;try{const saved=savedChildren().find(c=>c.id===id&&!c.deleted);if(saved){await selectChild(saved.key);return}const f=new FormData();f.set('child',id);const data=await api('children/select',f,'');await selectChild(data.session)}catch(e){fail(e)}}
async function selectChild(key){if(busy)return;try{key=cleanKey(key);me=await api('me',null,key);token=localStorage.familyKey=key;remember(me);modal.close();await load();toast('已切换到 '+me.name);await finishPending()}catch(e){fail(e)}}
function switchChild(){const c=dialog('选择已有孩子');drawGate(c)}
function renameChild(){const c=dialog('修改昵称'),f=el('form'),name=el('input'),submit=el('button','保存昵称','wide primary');name.value=me.name;name.required=true;name.maxLength=16;submit.type='submit';f.append(name,submit);f.onsubmit=e=>{e.preventDefault();act('rename',{name:name.value})};c.append(f)}
function editReward(r){const c=dialog('编辑奖励'),f=el('form'),name=el('input'),cost=el('input'),save=el('button','保存修改','wide primary');name.value=r.name;name.required=true;name.maxLength=50;cost.type='number';cost.value=r.cost;cost.min=1;cost.step=1;cost.required=true;save.type='submit';f.append(el('label','奖励名称'),name,el('label','所需星星'),cost,save);f.onsubmit=async e=>{e.preventDefault();save.disabled=true;save.textContent='保存中…';const ok=await act('editReward',{reward:r.id,name:name.value,cost:cost.value});if(!ok){save.disabled=false;save.textContent='保存修改'}};c.append(f)}
function manageChildren(){const c=dialog('自己创建的孩子');remember(me);for(const child of savedChildren().filter(c=>!c.deleted)){const actions=el('div');if(child.deleted)actions.append(btn('恢复',()=>act('restorePlayer',{},child.key)));else actions.append(btn('删除',()=>confirmDelete('deletePlayer',child.key,child.name),'danger'));row(c,child.name+(child.id===me.id?'（当前）':''),actions,child.deleted?'已移出榜单':'本浏览器保存的身份')}c.append(el('p','已删除的孩子不再显示。这里只列出本浏览器保存过的有效身份。','muted'))}
function confirmDelete(action,key,name){const c=dialog(action==='reset'?'清空孩子记录':'删除孩子');c.append(el('p',action==='reset'?'清空「'+name+'」的打卡、星星与兑换记录，保留奖励设置。可恢复上次清空的数据。':'将「'+name+'」移出榜单。记录保留，原身份可以恢复。'),btn('确认'+(action==='reset'?'清空记录':'删除此孩子'),()=>act(action,{},key),'wide'))}
draw();load().catch(fail);setInterval(()=>{if(!busy&&!document.hidden&&!modal.open)load().catch(fail)},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy&&!modal.open)load().catch(fail)});
</script></body></html>
